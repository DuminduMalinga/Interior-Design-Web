# Compose override, run from backend/deploy:
#   docker compose -f docker-compose.yml -f ../security/config/docker-hardening.yml up -d
#
# TRY THIS ON A TEST SERVER FIRST. A read-only filesystem can crash a service that writes
# somewhere unexpected. The layout services only need /tmp (provided below). The detector is
# the risky one: Ultralytics writes settings and libraries may write caches under the home
# folder. The detector block below points the known ones at /tmp. Do NOT change HOME: the
# EasyOCR model volume is mounted at /root/.EasyOCR and would be re-downloaded. If the
# detector will not start, check `docker compose logs detector` for the path it could not
# write and either redirect it the same way or remove `read_only` from that one service.
#
# Also add to Dockerfile.layout before CMD (services use port 8000, so non-root is fine):
#   RUN useradd -r -u 10001 app && chown -R app /app
#   USER app
# For the detector, named volumes (easyocr_models, detector_output) are created root-owned:
# chown them to the same user once, or run the detector as root and keep the other limits.

x-hardened: &hardened
  read_only: true
  tmpfs: ["/tmp"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 200
  mem_limit: 512m

services:
  living-room:    { <<: *hardened }
  bedroom:        { <<: *hardened }
  kitchen:        { <<: *hardened }
  bathroom:       { <<: *hardened }
  dining:         { <<: *hardened }
  master-bedroom: { <<: *hardened }
  detector:
    <<: *hardened
    mem_limit: 4g   # torch + OCR; /app/output and the OCR cache are already volumes
    environment:
      YOLO_CONFIG_DIR: /tmp/yolo  # Ultralytics settings (writable tmpfs)
      MPLCONFIGDIR: /tmp/mpl      # matplotlib cache, if a dependency imports it
      MAX_IMAGE_BYTES: "10485760" # 10 MB, the same as the upload page and the bucket
