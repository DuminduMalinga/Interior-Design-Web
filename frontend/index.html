
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>3D Layout System: floor plan to furnished 3D room</title>
    <meta name="description" content="Upload a 2D floor plan and get furniture layouts ranked by score, each one ready to explore in 3D." />
      <script>
        // Apply the saved theme before first paint to avoid a dark/light flash.
        // Keep the storage key in sync with src/app/context/ThemeContext.tsx.
        (function () {
          var theme = "dark";
          try {
            if (localStorage.getItem("theme-preference") === "light") theme = "light";
          } catch (e) {}
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;
        })();
      </script>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
